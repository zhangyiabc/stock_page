# 底部放量策略
name: bottom_volume
display_name: 底部放量
description: 识别股价长期下跌后在底部区域出现异常放量的潜在反转信号
category: reversal

core_rules:
  - 股价处于近 60 日低位区（距最高点跌幅 > 30%）
  - 突然出现成交量大幅放大（量比 > 3.0）
  - 需结合基本面排除利空

required_tools:
  - get_kline
  - get_realtime_quote
  - get_stock_news

conditions:
  entry:
    - 股价在近 60 日最低价附近（距最低价 < 5%）
    - 出现异常放量（量比 > 3.0 或成交量 > 20 日均量 × 3）
    - 放量当日收阳线或十字星（非放量下跌）
    - 无重大利空新闻
  exit:
    - 放量后 5 日内再次创新低 → 止损
    - 反弹至 MA20 → 减仓 1/3
    - 突破 MA60 → 底部反转确认

instructions: |
  ## 底部放量策略分析步骤

  1. **获取 K 线数据**：调用 get_kline 获取近 120 个交易日的日线数据
  2. **判断底部区域**：
     - 计算近 60 日最高价和最低价
     - 当前价距最高价跌幅 > 30% → 处于底部区域
     - 近 20 日波动收窄 → 底部构造中
  3. **识别异常放量**：
     - 当日成交量 / 20 日平均成交量 ≥ 3 → 异常放量
     - 放量日收阳线 → 积极信号
     - 放量日收阴线 → 可能恐慌出货，谨慎
  4. **排除利空**：
     - 调用 get_stock_news 获取近期新闻
     - 检查是否有 ST 风险、业绩暴雷、监管处罚等
  5. **确认信号**：
     - 底部放量 + 收阳 + 无利空 → 潜在反转信号
     - 连续 2-3 日放量 → 更可靠
  6. **给出结论**：底部放量反转概率评估，建议分批试探性建仓
