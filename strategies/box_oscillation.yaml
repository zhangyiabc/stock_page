# 箱体震荡策略
name: box_oscillation
display_name: 箱体震荡
description: 识别横盘震荡区间，在箱底买入箱顶卖出的区间操作策略
category: framework

core_rules:
  - 股价在明确区间内反复震荡
  - 箱体宽度 5%-15% 有操作价值
  - 箱底附近买入，箱顶附近卖出

required_tools:
  - get_kline
  - get_realtime_quote

conditions:
  entry:
    - 近 20-40 日内股价在某区间反复震荡至少 2 次触及上下沿
    - 箱体宽度（(箱顶 - 箱底) / 箱底 × 100%）在 5%-15%
    - 当前价格接近箱底（距箱底 < 箱体宽度的 20%）
    - 在箱底附近出现企稳信号（十字星、小阳线）
  exit:
    - 价格接近箱顶 → 减仓或清仓
    - 放量跌破箱底 → 止损离场
    - 放量突破箱顶 → 持有观察，可能变为趋势行情

instructions: |
  ## 箱体震荡策略分析步骤

  1. **获取 K 线数据**：调用 get_kline 获取近 60 个交易日的日线数据
  2. **识别箱体区间**：
     - 找出近期至少 2 次触及的高点区域 → 箱顶
     - 找出近期至少 2 次触及的低点区域 → 箱底
     - 误差范围 ±2% 内视为同一水平
  3. **箱体有效性验证**：
     - 箱体持续时间 ≥ 15 个交易日
     - 箱体宽度 5%-15%
     - 至少 2 次触顶 + 2 次触底
  4. **当前位置判断**：
     - 计算当前价在箱体中的位置百分比
     - 底部 20% → 买入区；顶部 20% → 卖出区
  5. **突破/跌破预警**：
     - 接近箱顶且放量 → 可能向上突破
     - 接近箱底且放量 → 可能向下跌破
  6. **给出结论**：箱体完好则区间操作；出现突破/跌破信号则策略切换
