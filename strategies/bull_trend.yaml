# 多头趋势策略
name: bull_trend
display_name: 多头趋势
description: 识别MA多头排列的强势上涨趋势，适合趋势持续阶段加仓
category: trend

core_rules:
  - MA5 > MA10 > MA20 > MA60（完美多头排列）
  - 量价齐升，趋势健康
  - 回踩均线不破支撑

required_tools:
  - get_kline
  - get_realtime_quote

conditions:
  entry:
    - MA5 > MA10 > MA20 > MA60 持续 3 天以上
    - 价格回踩 MA10 获支撑并企稳
    - 成交量在均量线以上
  exit:
    - MA5 下穿 MA10 → 减仓 1/3
    - MA10 下穿 MA20 → 减至半仓
    - 跌破 MA60 → 清仓

instructions: |
  ## 多头趋势策略分析步骤

  1. **获取 K 线数据**：调用 get_kline 获取近 120 个交易日的日线数据
  2. **计算均线体系**：MA5, MA10, MA20, MA60
  3. **判断多头排列**：
     - 检查最近 N 个交易日是否满足 MA5 > MA10 > MA20 > MA60
     - 持续时间越长，趋势越强
  4. **回踩判断**：
     - 股价触及 MA10 或 MA20 后不跌破 → 回踩买点
     - 触及 MA20 后反弹 + 放量 → 强支撑确认
  5. **趋势强度评估**：
     - 均线发散角度：角度越大趋势越强
     - MA20 斜率：正斜率且持续上升 → 趋势健康
  6. **给出结论**：已在趋势中 → 持有或加仓；刚形成多头 → 等回踩介入
