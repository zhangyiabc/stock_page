# 情绪周期策略
name: emotion_cycle
display_name: 情绪周期
description: 基于市场情绪周期和个股换手率判断买卖时机
category: framework

core_rules:
  - 结合市场整体情绪和个股情绪
  - 极端恐慌中寻找机会，极端贪婪中控制风险
  - 换手率是衡量情绪的核心指标

required_tools:
  - get_kline
  - get_realtime_quote
  - get_market_sentiment
  - get_stock_news

conditions:
  entry:
    - 市场情绪偏冷或极冷（涨跌比 < 0.5）
    - 个股换手率从高位回落至 < 2%（恐慌释放）
    - 基本面无硬伤
    - 新闻情绪由负转中性或正面
  exit:
    - 个股换手率飙升 > 10%（过热）
    - 市场情绪极热（涨跌比 > 3.0）
    - 出现利空新闻导致情绪恶化

instructions: |
  ## 情绪周期策略分析步骤

  1. **获取市场情绪**：调用 get_market_sentiment
     - 涨跌比 > 2.0 → 偏热；< 0.5 → 偏冷
     - 涨停 > 40 → 情绪火热；跌停 > 20 → 恐慌
  2. **获取个股数据**：调用 get_kline + get_realtime_quote
     - 关注换手率变化趋势
     - 低换手（< 0.5%）= 冷淡；高换手（> 5%）= 过热
  3. **情绪阶段判断**：
     - 恐慌底部 → 换手率降至极低 + 市场极冷 → 左侧布局区
     - 犹豫期 → 换手率温和放大 + 价格企稳 → 右侧确认区
     - 狂热顶部 → 换手率飙升 + 人气爆棚 → 离场区
  4. **新闻情绪叠加**：调用 get_stock_news
     - 恐慌中出现正面消息 → 催化反转
     - 狂热中出现利空 → 加速见顶
  5. **给出结论**：
     - 当前处于情绪周期哪个阶段
     - 是否存在情绪拐点信号
