# 均线金叉策略
name: ma_golden_cross
display_name: 均线金叉
description: 检测均线金叉信号配合量能确认，适合趋势启动初期介入
category: trend

core_rules:
  - 乖离率 < 5%（严禁追高）
  - MA5 > MA10 > MA20（多头排列确认）
  - 量能确认（量比 > 1.2）

required_tools:
  - get_kline
  - get_realtime_quote

conditions:
  entry:
    - MA5 上穿 MA10（金叉），且 MA20 走平或上翘
    - 金叉当日或次日放量（量比 > 1.2）
    - 乖离率 < 5%，价格未过分偏离均线
  exit:
    - MA5 下穿 MA10（死叉）
    - 跌破 MA20 减半仓
    - 盈利 > 10% 后跌破 MA10 止盈

instructions: |
  ## 均线金叉策略分析步骤

  1. **获取 K 线数据**：调用 get_kline 获取近 60 个交易日的日线数据
  2. **计算均线**：
     - MA5 = 近 5 日收盘价的简单移动平均
     - MA10 = 近 10 日收盘价的简单移动平均
     - MA20 = 近 20 日收盘价的简单移动平均
  3. **判断金叉**：
     - 前一日 MA5 ≤ MA10，当日 MA5 > MA10 → 金叉成立
     - 如果同时 MA10 > MA20 → 强金叉（更可靠）
  4. **量能验证**：
     - 当日成交量 / 近 5 日平均成交量 = 量比
     - 量比 > 1.2 为有效放量，量比 > 2.0 为大幅放量
  5. **乖离率检查**：
     - BIAS5 = (当前价 - MA5) / MA5 × 100%
     - BIAS5 > 5% → 追高风险，不宜介入
  6. **给出结论**：金叉 + 放量 + 低乖离 = 买入信号；否则观望
