# 北向资金跟踪策略
name: northbound_follow
display_name: 北向资金跟踪
description: 跟踪北向资金（沪深股通）的大规模流入流出，识别外资偏好
category: capital_flow

core_rules:
  - 北向资金连续大幅净买入为积极信号
  - 结合个股十大流通股东中的外资变化
  - 外资偏好消费、医药、科技龙头

required_tools:
  - get_north_flow
  - get_kline
  - get_realtime_quote
  - get_sector_flow

conditions:
  entry:
    - 北向资金连续 3 日净买入且单日 > 50 亿
    - 受益板块（消费、医药、科技）涨幅居前
    - 个股为北向资金偏好的核心标的
  exit:
    - 北向资金连续 3 日大幅净卖出
    - 人民币汇率大幅贬值（外资可能撤离）
    - 个股已大幅上涨，估值偏贵

instructions: |
  ## 北向资金跟踪策略分析步骤

  1. **获取北向资金数据**：调用 get_north_flow
     - 沪股通 + 深股通合计净买额
     - 判断近期资金流向趋势
  2. **板块资金共振**：调用 get_sector_flow
     - 北向资金大幅流入 + 对应板块领涨 → 共振信号
     - 特别关注消费、医药、金融、科技板块
  3. **个股筛选**：
     - 北向资金重仓股（茅台、招行、美的等）
     - 近期有增持迹象的标的
  4. **时机判断**：
     - 市场调整期北向资金逆势买入 → 底部信号
     - 市场高位北向资金持续卖出 → 风险信号
  5. **给出结论**：
     - 北向资金流向是否支持当前操作方向
     - 是否存在资金流向拐点
