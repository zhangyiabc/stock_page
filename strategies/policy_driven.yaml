# 政策驱动策略
name: policy_driven
display_name: 政策驱动
description: 追踪重大产业政策、宏观调控对相关板块和个股的影响
category: event

core_rules:
  - 政策明确利好特定行业
  - 受益标的明确且基本面良好
  - 注意买预期卖事实

required_tools:
  - get_kline
  - get_realtime_quote
  - get_policy_news
  - get_sector_flow
  - get_stock_news

conditions:
  entry:
    - 出台明确利好政策（如补贴、减税、产业规划）
    - 受益板块资金净流入
    - 个股为行业龙头或核心受益标的
    - 股价尚未大幅上涨（涨幅 < 10%）
  exit:
    - 政策效果已被市场充分消化（上涨 > 30%）
    - 政策出现不及预期或反转信号
    - 板块资金连续 3 日净流出

instructions: |
  ## 政策驱动策略分析步骤

  1. **政策研判**：调用 get_policy_news
     - 判断政策的力度（指导性 vs 强制性）
     - 判断政策的持续性（短期刺激 vs 长期规划）
     - 判断受益行业和产业链环节
  2. **板块验证**：调用 get_sector_flow
     - 受益板块是否出现资金净流入
     - 板块内个股普涨 → 市场认可度高
  3. **个股筛选**：
     - 行业龙头优先
     - 业绩能兑现政策利好的优先
     - 市值适中（不宜太大，弹性不足）
  4. **时机把握**：
     - 政策公布初期（1-3 日）→ 第一波
     - 细则落地期 → 第二波
     - 业绩兑现期 → 第三波（最可靠）
  5. **风险控制**：
     - "买预期卖事实"：政策正式落地时获利了结
     - 跟踪政策执行情况，防止不及预期
