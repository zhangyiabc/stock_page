# 缩量回调策略
name: shrink_pullback
display_name: 缩量回调
description: 在上升趋势中等待缩量回调至均线支撑位的低吸机会
category: trend

core_rules:
  - 前期有明确的上涨趋势
  - 回调时成交量持续缩小（< 前期均量 50%）
  - 回踩 MA10 或 MA20 获支撑

required_tools:
  - get_kline
  - get_realtime_quote

conditions:
  entry:
    - 处于上升趋势（MA20 上行）
    - 近 3-5 日回调，成交量逐日缩小
    - 缩量至 5 日均量的 50% 以下
    - 价格触及 MA10 或 MA20 企稳
  exit:
    - 放量跌破 MA20 → 趋势可能反转，止损
    - 反弹至前高附近 → 止盈 1/3
    - MA20 走平或下行 → 趋势减弱，离场

instructions: |
  ## 缩量回调策略分析步骤

  1. **获取 K 线数据**：调用 get_kline 获取近 60 个交易日的日线数据
  2. **确认上升趋势**：
     - MA20 连续 10 日保持上行
     - 近 20 日内有过一波明显上涨（涨幅 > 10%）
  3. **识别回调阶段**：
     - 近 3-5 日价格下跌或横盘
     - 成交量逐日缩小，呈递减态势
  4. **缩量程度判断**：
     - 回调期间日均量 / 上涨期间日均量 < 50% → 缩量充分
     - 量能越小说明抛压越轻
  5. **支撑位确认**：
     - 价格触及 MA10 或 MA20 后不再下跌
     - 出现十字星或小阳线 → 企稳信号
  6. **给出结论**：缩量充分 + 均线支撑 + 趋势完好 → 低吸机会
