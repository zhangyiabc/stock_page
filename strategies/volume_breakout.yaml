# 放量突破策略
name: volume_breakout
display_name: 放量突破
description: 捕捉股价突破关键阻力位时的放量信号，适合突破行情
category: trend

core_rules:
  - 突破前高或箱体上沿
  - 突破当日放量（量比 > 2.0）
  - 乖离率 < 8%

required_tools:
  - get_kline
  - get_realtime_quote

conditions:
  entry:
    - 股价突破近 20 日最高价或明确的阻力位
    - 突破日成交量 ≥ 前 5 日均量的 2 倍
    - 收盘价站稳在突破位之上（实体突破，非假突破）
  exit:
    - 突破后 3 日内回落至突破位以下 → 假突破，止损
    - 盈利 > 15% → 止盈 1/3
    - 跌破 MA10 → 清仓

instructions: |
  ## 放量突破策略分析步骤

  1. **获取 K 线数据**：调用 get_kline 获取近 60 个交易日的日线数据
  2. **识别阻力位**：
     - 近 20 日最高价
     - 前期高点（如有明显的 M 头、W 底颈线位等）
     - 整数关口（如 10 元、20 元、50 元、100 元）
  3. **判断突破有效性**：
     - 收盘价 > 阻力位 → 初步突破
     - 实体部分（开盘到收盘）> 阻力位 → 强突破
     - 上影线过长 → 可能假突破
  4. **量能验证**：
     - 突破日成交量 / 5 日均量 ≥ 2.0 → 有效放量
     - 连续 2 日放量更可靠
  5. **假突破过滤**：
     - 突破后 3 日内是否回落至突破位下方
     - 回落时缩量 → 健康回踩；回落时放量 → 假突破
  6. **给出结论**：有效突破 + 放量 → 买入；假突破风险 → 观望
